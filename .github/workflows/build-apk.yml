name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Write config from SITE_URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ID: ${{ vars.APP_ID }}
        run: node scripts/prepare.js

      - name: Add Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vendor-sites.apk

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-sites-apk
          path: vendor-sites.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Vendor Sites APK #${{ github.run_number }}
          files: vendor-sites.apk
